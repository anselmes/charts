---
# MARK: Operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio-operator
  namespace: minio
spec:
  interval: 10m0s
  releaseName: minio-operator
  timeout: 15m0s
  chart:
    spec:
      interval: 5m
      chart: aistor
      version: 1.2.0
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    aistorop:
      enabled: true
---
# MARK: MinIO
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 10m0s
  releaseName: minio
  timeout: 15m0s
  dependsOn:
    - name: minio-secrets
    - name: minio-operator
  chart:
    spec:
      interval: 5m
      chart: aistor
      version: 1.2.0
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    remediation:
      remediateLastFailure: true
      retries: 3
  values:
    aistor:
      enabled: true
      secrets:
        name: minio-env-configuration
        existingSecret: true
      objectStore:
        name: minio
        existingSecret: true
        configuration:
          name: minio-env-configuration
        env:
          - name: MINIO_SITE_NAME
            value: ${MINIO_SITE_NAME}
          - name: MINIO_SITE_REGION
            value: ${MINIO_SITE_REGION}
          - name: MINIO_BROWSER_REDIRECT_URL
            value: https://minio.${DOMAIN_NAME}
          - name: MINIO_COMPRESSION_ENABLE
            value: "on"
          - name: MINIO_COMPRESSION_EXTENSIONS
            value: .txt,.log,.csv,.json,.tar,.xml,.bin,.pdf
          - name: MINIO_COMPRESSION_MIME_TYPES
            value: text/*,application/json,application/xml
        pools:
          - name: pool-0
            servers: 1
            size: 25Gi
        kes:
          replicas: 1
          keyName: minio-key
          serviceAccountName: minio-sa
          trustedCAs:
            - name: vault-ca
          configuration: |-
            address: :7373
            tls:
              key: /tmp/kes/server.key
              cert: /tmp/kes/server.crt
            admin:
              # Operator-injected client identity (MinIO and the sidecar authenticate with it).
              # Run envsubst with an explicit variable list so this one is left untouched.
              identity: ${MINIO_KES_IDENTITY}
            cache:
              expiry:
                any: 5m0s
                unused: 20s
            log:
              error: on
              audit: off
            keystore:
              # fs is not recommended outside dev; switch to a real KMS (e.g. vault) for production.
              # fs:
              #   path: /tmp/kes/keys
              vault:
                endpoint: https://vault.ucp.svc.cluster.local:8200
                engine: secret
                version: v2
                prefix: minio/kes
                # Kubernetes auth: no static secret in this config. Needs a Vault/OpenBao role
                # bound to the KES service account (see kes.serviceAccountName).
                kubernetes:
                  engine: kubernetes
                  role: minio-kes
                  jwt: /var/run/secrets/kubernetes.io/serviceaccount/token
                  retry: 15s
                status:
                  ping: 10s
    secret:
      enabled: true
      externalSecrets:
        - kind: ExternalSecret
          name: minio-env-configuration
          hook: pre-install,pre-upgrade
          externalSecretSpec:
            refreshPolicy: CreatedOnce
            target:
              creationPolicy: Orphan
              immutable: true
              template:
                data:
                  config.env: |-
                    export MINIO_ROOT_USER=admin
                    export MINIO_ROOT_PASSWORD="{{ .password }}"
            dataFrom:
              - sourceRef:
                  generatorRef:
                    apiVersion: generators.external-secrets.io/v1alpha1
                    kind: ClusterGenerator
                    name: password-generator
        - kind: ExternalSecret
          name: minio-license
          hook: pre-install,pre-upgrade
          externalSecretSpec:
            secretStoreRef:
              name: external-secrets-store-vault
              kind: ClusterSecretStore
            data:
              # checkov:skip=CKV_SECRET_6
              - secretKey: minio.license
                remoteRef:
                  key: minio/license
                  property: key
        - kind: ExternalSecret
          name: vault-ca
          hook: pre-install,pre-upgrade
          externalSecretSpec:
            refreshInterval: 1h
            secretStoreRef:
              name: external-secrets-store-ucp
              kind: ClusterSecretStore
            data:
              - secretKey: ca.crt
                remoteRef:
                  key: vault-tls
                  property: ca.crt
    gateway:
      enabled: true
      routes:
        - name: minio-http-route
          kind: HTTPRoute
          hostnames:
            - s3.${DOMAIN_NAME}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: "{{ .Release.Name }}"
                  port: 443
            - filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
          gateways:
            - name: default-gateway
              namespace: kube-system
        - name: minio-console-http-route
          kind: HTTPRoute
          hostnames:
            - minio.${DOMAIN_NAME}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: /
              backendRefs:
                - name: "{{ .Release.Name }}-console"
                  port: 9443
            - filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
          gateways:
            - name: default-gateway
              namespace: kube-system
      policies:
        - name: minio-api-backend-tls
          validation:
            hostname: "{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local"
            caCertificateRefs:
              - group: ""
                kind: ConfigMap
                name: kube-root-ca.crt
          targetRefs:
            - group: ""
              kind: Service
              name: "{{ .Release.Name }}"
        - name: minio-console-backend-tls
          validation:
            hostname: "{{ .Release.Name }}-console.{{ .Release.Namespace }}.svc.cluster.local"
            caCertificateRefs:
              - group: ""
                kind: ConfigMap
                name: kube-root-ca.crt
          targetRefs:
            - group: ""
              kind: Service
              name: "{{ .Release.Name }}-console"
