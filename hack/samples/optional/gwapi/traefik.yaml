---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: kube-system
spec:
  interval: 10m0s
  releaseName: traefik
  timeout: 15m0s
  chart:
    spec:
      interval: 5m
      chart: gwapi
      version: 1.0.7
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    envoy:
      enabled: false
    traefik:
      enabled: true
      experimental:
        kubernetesGateway:
          enabled: true
      gatewayClass:
        enabled: true
      providers:
        kubernetesGateway:
          enabled: true
          experimentalChannel: true
