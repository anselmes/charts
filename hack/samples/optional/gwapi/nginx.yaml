---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
  namespace: kube-system
spec:
  interval: 10m0s
  releaseName: nginx
  timeout: 15m0s
  chart:
    spec:
      interval: 5m
      chart: gwapi
      version: 1.0.7
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    envoy:
      enabled: false
    nginx:
      enabled: true
      nginxGateway:
        gwAPIExperimentalFeatures:
          enable: true
        gwAPIInferenceExtension:
          enable: true
        snippets:
          enable: true
