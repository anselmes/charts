---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: knative-operator
  namespace: operators
spec:
  interval: 10m0s
  releaseName: knative-operator
  timeout: 15m0s
  chart:
    spec:
      interval: 5m
      chart: knative
      version: 1.23.1
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    operator:
      enabled: true
