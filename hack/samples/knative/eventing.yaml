---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: knative-eventing
  namespace: knative
spec:
  interval: 10m0s
  releaseName: knative-eventing
  timeout: 15m0s
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: gateway
      namespace: kube-system
    - name: knative-operator
      namespace: operators
  chart:
    spec:
      interval: 5m
      chart: knative
      version: 1.23.1
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    operator:
      enabled: false
    # ca:
    #   enabled: true
    #   issuers:
    #     - name: knative-ca-issuer
    #       selfSigned: true
    #       secret:
    #         create: false
