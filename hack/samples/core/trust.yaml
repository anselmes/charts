---
# Distributes the root CA behind `ca-issuer` (see certmanager.yaml) as the `ca-issuer` Secret, key
# `ca.crt`, in the namespaces below. Vault pins it for Keycloak's OIDC discovery, MinIO trusts it
# for its OIDC login, and MinIO's KES trusts it to reach Vault (`vault-cert` is issued by
# `ca-issuer` too). The Secret is named after the Bundle, and trust-manager only reads the source
# from its own namespace (`cert-manager`). Needs the `ca` chart 1.3.0, which adds `bundles`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust
  namespace: cert-manager
spec:
  interval: 10m0s
  releaseName: trust
  timeout: 15m0s
  dependsOn:
    - name: ca-issuer
    - name: cert-manager
  chart:
    spec:
      interval: 5m
      chart: ca
      version: 1.3.0
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    issuers: []
    bundles:
      - name: ca-issuer
        wait: true
        sources:
          - secret:
              name: ca-issuer-tls
              key: ca.crt
        target:
          secret:
            key: ca.crt
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - minio
                  - ucp
