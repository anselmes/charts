---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-operator
  namespace: operators
spec:
  interval: 10m0s
  releaseName: external-secrets-operator
  timeout: 15m0s
  chart:
    spec:
      interval: 5m
      chart: eso
      version: 2.8.2
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    generators:
      - kind: ClusterGenerator
        name: password-generator
        generator:
          passwordSpec:
            length: 42
            digits: 5
            symbols: 5
            symbolCharacters: -_$@
            noUpper: false
            allowRepeat: true
      # - kind: ClusterGenerator
      #   name: uuidgen
      #   type: UUID
      #   generator:
      #     uuidSpec: {}
      # - kind: ClusterGenerator
      #   name: sshkeygen
      #   type: SSHKey
      #   generator:
      #     sshKeySpec:
      #       keyType: ed25519
    eso:
      enabled: true
      replicaCount: 1
      bitwarden-sdk-server:
        enabled: false
        namespaceOverride: ""
