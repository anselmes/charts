---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway
  namespace: kube-system
spec:
  interval: 10m0s
  releaseName: gateway
  timeout: 15m0s
  dependsOn:
    - name: envoy
      namespace: kube-system
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      interval: 5m
      chart: gateway
      version: 1.2.3
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    gateways:
      - name: default-gateway
        className: envoy
        allowedListeners:
          namespaces:
            from: Same
        listeners:
          - name: http
            port: 80
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - kind: HTTPRoute
    # Port 80 lives on the Gateway itself, while the app routes attach to the ListenerSet, so
    # nothing else answers plain HTTP. Redirect every HTTP request to HTTPS.
    routes:
      - name: https-redirect
        kind: HTTPRoute
        rules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  scheme: https
                  statusCode: 301
        listeners:
          - name: default-gateway
            sectionName: http
    listenerSet:
      gatewayRef:
        name: default-gateway
      listeners:
        - name: udp
          port: 80
          protocol: UDP
          allowedRoutes:
            namespaces:
              from: All
            kinds:
              - kind: UDPRoute
        - name: tls
          port: 443
          protocol: TLS
          allowedRoutes:
            namespaces:
              from: All
            kinds:
              - kind: TLSRoute
          tls:
            mode: Passthrough
        - name: https
          port: 443
          protocol: HTTPS
          hostname: "*.${DOMAIN_NAME}"
          allowedRoutes:
            namespaces:
              from: All
            kinds:
              - kind: GRPCRoute
              - kind: HTTPRoute
          tls:
            mode: Terminate
            certificateRefs:
              - name: http-gw-cert
                issuer: ca-issuer
