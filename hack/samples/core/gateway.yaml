---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway
  namespace: kube-system
spec:
  interval: 10m0s
  releaseName: gateway
  timeout: 15m0s
  dependsOn:
    - name: envoy
      namespace: kube-system
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      interval: 5m
      chart: gateway
      version: 1.0.3
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    gateways:
      - name: http-gateway
        className: envoy
        listeners:
          - name: http
            port: 80
            protocol: HTTP
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - kind: HTTPRoute
          - name: https
            port: 443
            protocol: HTTPS
            hostname: "*.${DOMAIN_NAME}"
            allowedRoutes:
              namespaces:
                from: All
              kinds:
                - kind: HTTPRoute
            tls:
              mode: Terminate
              certificateRefs:
                - name: http-gw-cert
                  issuer: ca-issuer
      # - name: tls-gateway
      #   className: envoy
      #   listeners:
      #     - name: tls
      #       port: 8443
      #       protocol: TLS
      #       hostname: "*.${DOMAIN_NAME}"
      #       allowedRoutes:
      #         namespaces:
      #           from: All
      #         kinds:
      #           - kind: TLSRoute
      #       tls:
      #         mode: Passthrough
      # - name: grpc-gateway
      #   className: envoy
      #   listeners:
      #     - name: grpc
      #       port: 8080
      #       protocol: HTTPS
      #       hostname: "*.${DOMAIN_NAME}"
