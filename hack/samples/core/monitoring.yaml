---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: sre
spec:
  interval: 10m0s
  releaseName: monitoring
  timeout: 15m0s
  dependsOn:
    - name: clickstack
  chart:
    spec:
      interval: 5m
      chart: monitoring
      version: 7.0.1
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    remediation:
      remediateLastFailure: true
      retries: 3
  values:
    # OTel agents: node-local (DaemonSet) and cluster-wide (single replica) Kubernetes telemetry -> ClickStack collector.
    node-agent:
      enabled: true
      # config:
      #   exporters:
      #     otlp:
      #       endpoint: otlp.example.com:443
      #       # tls:
      #       #   insecure: true
    cluster-agent:
      enabled: true
      # config:
      #   exporters:
      #     otlp:
      #       endpoint: otlp.example.com:443
      #       # tls:
      #       #   insecure: true
