---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: operator
  namespace: operators
spec:
  interval: 10m0s
  releaseName: operator
  timeout: 15m0s
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      interval: 5m
      chart: operator
      version: 1.0.3
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    mysql:
      enabled: true
      watchAllNamespaces: true
      disableTelemetry: true
    postgres:
      enabled: true
      watchAllNamespaces: true
      disableTelemetry: true
    redis:
      enabled: true
      redisOperator:
        webhook: true
      certmanager:
        enabled: true
      service:
        namespace: operators
