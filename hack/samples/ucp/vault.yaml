---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-credential
  namespace: ucp
spec:
  interval: 10m0s
  releaseName: vault-credential
  timeout: 15m0s
  dependsOn:
    - name: external-secrets-generator
      namespace: sre
  chart:
    spec:
      interval: 5m
      chart: eso
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    externalSecrets:
      - kind: ExternalSecret
        name: vault-initial-admin-password
        hook: pre-install,pre-upgrade
        externalSecretSpec:
          refreshInterval: "0"
          target:
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password-generator
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: ucp
spec:
  interval: 10m0s
  releaseName: vault
  timeout: 15m0s
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: gateway
      namespace: kube-system
    - name: operator
      namespace: operators
  chart:
    spec:
      interval: 5m
      chart: vault
      version: 0.30.8
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    global:
      tlsDisable: false
    vault:
      injector:
        metrics:
          enabled: false
      server:
        image:
          registry: ghcr.io
          repository: labsonline/openbao-hsm-ubi-nethsm
          pullPolicy: Always
        extraEnvironmentVars:
          PGSSLMODE: require
          PGSSLROOTCERT: /etc/ssl/certs/pg-ca.crt
        extraSecretEnvironmentVars:
          - envName: INITIAL_ADMIN_PASSWORD
            secretName: vault-initial-admin-password
            secretKey: password
          - envName: PGHOST
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: host
          - envName: PGPORT
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: port
          - envName: PGUSER
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: user
          - envName: PGPASSWORD
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: password
          - envName: PGDATABASE
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: dbname
        volumes:
          - name: pg-ca-cert
            secret:
              secretName: vault-postgres-cluster-cert
              items:
                - key: ca.crt
                  path: ca.crt
          - name: vault-tls
            secret:
              secretName: vault-tls
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
          - name: p11nethsm
            configMap:
              name: p11nethsm
        volumeMounts:
          - name: pg-ca-cert
            mountPath: /etc/ssl/certs/pg-ca.crt
            subPath: ca.crt
            readOnly: true
          - name: vault-tls
            mountPath: /etc/ssl/certs/vault-tls.crt
            subPath: tls.crt
            readOnly: true
          - name: vault-tls
            mountPath: /etc/ssl/private/vault-tls.key
            subPath: tls.key
            readOnly: true
          - name: p11nethsm
            mountPath: /etc/nitrokey/p11nethsm.conf
            subPath: p11nethsm.conf
            readOnly: true
        standalone:
          config: |
            ui = true

            api_addr = "https://vault.${DOMAIN_NAME}"
            plugin_directory = "/usr/local/lib/openbao/plugins"

            storage "postgresql" {}

            listener "tcp" {
              tls_disable = 0
              tls_cert_file = "/etc/ssl/certs/vault-tls.crt"
              tls_key_file  = "/etc/ssl/private/vault-tls.key"
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              telemetry {
               unauthenticated_metrics_access = "true"
              }
            }

            # Enable userpass auth
            initialize "auth" {
              request "enable-userpass" {
                operation = "update"
                path      = "sys/auth/userpass"
                data = {
                  type = "userpass"
                }
              }
            }

            # Create an admin policy
            initialize "policy" {
              request "superuser-policy" {
                operation = "update"
                path      = "sys/policies/acl/superuser"
                data = {
                  policy = "path \"*\" { capabilities = [\"create\",\"read\",\"update\",\"delete\",\"list\",\"sudo\"] }"
                }
              }
            }

            # Create admin user with password from env var (or swap to file source)
            initialize "identity" {
              request "admin-user" {
                operation = "update"
                path      = "auth/userpass/users/admin"
                data = {
                  password = {
                    eval_type   = "string"
                    eval_source = "env"
                    env_var     = "INITIAL_ADMIN_PASSWORD"
                    require_present = true
                  }
                  token_policies = ["superuser"]
                }
              }
            }

            seal "pkcs11" {
              lib       = "/usr/lib/nitrokey/libnethsm_pkcs11.so"
              slot      = "0"
              key_label = "bao-root-rsa"
              pin       = "${NETHSM_OPERATOR_PASSPHRASE}"
            }

            # Example configuration for enabling Prometheus metrics in your config.
            #telemetry {
            #  prometheus_retention_time = "30s"
            #  disable_hostname = true
            #}
    data:
      postgres:
        enabled: true
        postgresVersion: 17
        instances:
          - name: vaultdb
            replicas: 1
            dataVolumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
        proxy:
          pgBouncer:
            replicas: 1
    ca:
      enabled: true
      certificates:
        - name: vault
          dns:
            name: vault
            aliases:
              - vault.ucp.svc.cluster.local
              - vault.ucp.svc
              - vault.ucp
              - vault
          issuerRef:
            name: ca-issuer
            kind: ClusterIssuer
    gateway:
      enabled: true
      routes:
        - name: vault
          kind: HTTPRoute
          hostnames:
            - vault.${DOMAIN_NAME}
          rules:
            - matches:
                - headers:
                    - name: X-Forwarded-Proto
                      value: http
              filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
            - backendRefs:
                - name: vault
                  port: 8200
          gateways:
            - name: default-gateway
              namespace: kube-system
      policies:
        - name: tls-upstream-vault
          validation:
            hostname: vault.ucp.svc.cluster.local
            caCertificateRefs:
              - group: ""
                kind: Secret
                name: vault-tls
          targetRefs:
            - group: ""
              kind: Service
              name: vault
