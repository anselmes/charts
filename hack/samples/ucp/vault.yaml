---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-keycloak-client
  namespace: iam
spec:
  interval: 10m0s
  releaseName: vault-keycloak-client
  timeout: 15m0s
  dependsOn:
    - name: keycloak
      namespace: iam
  chart:
    spec:
      interval: 5m
      chart: keycloak
      version: 26.8.2
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    keycloak:
      enabled: false
    secret:
      enabled: true
      externalSecrets:
        - kind: ExternalSecret
          name: vault-oidc-client
          hook: pre-install,pre-upgrade
          externalSecretSpec:
            refreshInterval: "0"
            target:
              creationPolicy: Owner
              template:
                metadata:
                  labels:
                    operator.keycloak.org/kind: KeycloakOIDCClient
                data:
                  client-secret: "{{ .password }}"
            dataFrom:
              - sourceRef:
                  generatorRef:
                    apiVersion: generators.external-secrets.io/v1alpha1
                    kind: ClusterGenerator
                    name: password-generator
    clients:
      - type: KeycloakOIDCClient
        name: vault
        keycloakRef: keycloak
        realmRef: ${KEYCLOAK_REALM_NAME}
        client:
          enabled: true
          loginFlows:
            - STANDARD
          redirectUris:
            - https://vault.${DOMAIN_NAME}/*
            # `bao login -method=oidc` listens locally for the callback.
            - http://localhost:8250/oidc/callback
          auth:
            method: client-secret
            secretRef:
              name: vault-oidc-client
              key: client-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-credential
  namespace: ucp
spec:
  interval: 10m0s
  releaseName: vault-credential
  timeout: 15m0s
  dependsOn:
    - name: external-secrets-generator
      namespace: sre
  chart:
    spec:
      interval: 5m
      chart: eso
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    externalSecrets:
      - kind: ExternalSecret
        name: vault-initial-admin-password
        hook: pre-install,pre-upgrade
        externalSecretSpec:
          refreshInterval: "0"
          target:
            creationPolicy: Owner
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ClusterGenerator
                  name: password-generator
      # CA of the default gateway certificate, which signs `iam.${DOMAIN_NAME}`. Vault needs it to
      # trust Keycloak's OIDC discovery endpoint.
      - kind: ExternalSecret
        name: default-gateway-ca
        hook: pre-install,pre-upgrade
        externalSecretSpec:
          refreshInterval: 1h
          secretStoreRef:
            name: external-secrets-store-kube-system
            kind: ClusterSecretStore
          data:
            - secretKey: ca.crt
              remoteRef:
                key: http-gw-cert
                property: ca.crt
      # OIDC client secret generated in `iam` (see vault-keycloak-client above).
      - kind: ExternalSecret
        name: vault-oidc-client
        hook: pre-install,pre-upgrade
        externalSecretSpec:
          refreshInterval: 1h
          secretStoreRef:
            name: external-secrets-store-iam
            kind: ClusterSecretStore
          data:
            - secretKey: client-secret
              remoteRef:
                key: vault-oidc-client
                property: client-secret
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: ucp
spec:
  interval: 10m0s
  releaseName: vault
  timeout: 15m0s
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: gateway
      namespace: kube-system
    - name: operator
      namespace: operators
    - name: vault-keycloak-client
      namespace: iam
    - name: external-secrets-store-gateway
      namespace: ucp
  chart:
    spec:
      interval: 5m
      chart: vault
      version: 0.30.8
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    global:
      tlsDisable: false
    vault:
      injector:
        metrics:
          enabled: false
      server:
        image:
          registry: ghcr.io
          repository: labsonline/openbao-hsm-ubi-nethsm
          pullPolicy: Always
        extraEnvironmentVars:
          PGSSLMODE: require
          PGSSLROOTCERT: /etc/ssl/certs/pg-ca.crt
        extraSecretEnvironmentVars:
          - envName: INITIAL_ADMIN_PASSWORD
            secretName: vault-initial-admin-password
            secretKey: password
          - envName: OIDC_CLIENT_SECRET
            secretName: vault-oidc-client
            secretKey: client-secret
          - envName: PGHOST
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: host
          - envName: PGPORT
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: port
          - envName: PGUSER
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: user
          - envName: PGPASSWORD
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: password
          - envName: PGDATABASE
            secretName: vault-postgres-pguser-vault-postgres
            secretKey: dbname
        volumes:
          - name: pg-ca-cert
            secret:
              secretName: vault-postgres-cluster-cert
              items:
                - key: ca.crt
                  path: ca.crt
          - name: vault-tls
            secret:
              secretName: vault-tls
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
          - name: default-gateway-ca
            secret:
              secretName: default-gateway-ca
              items:
                - key: ca.crt
                  path: ca.crt
          - name: p11nethsm
            configMap:
              name: p11nethsm
        volumeMounts:
          - name: pg-ca-cert
            mountPath: /etc/ssl/certs/pg-ca.crt
            subPath: ca.crt
            readOnly: true
          - name: vault-tls
            mountPath: /etc/ssl/certs/vault-tls.crt
            subPath: tls.crt
            readOnly: true
          - name: vault-tls
            mountPath: /etc/ssl/private/vault-tls.key
            subPath: tls.key
            readOnly: true
          - name: default-gateway-ca
            mountPath: /etc/ssl/certs/default-gateway-ca.crt
            subPath: ca.crt
            readOnly: true
          - name: p11nethsm
            mountPath: /etc/nitrokey/p11nethsm.conf
            subPath: p11nethsm.conf
            readOnly: true
        standalone:
          config: |
            ui = true

            api_addr = "https://vault.${DOMAIN_NAME}"
            plugin_directory = "/usr/local/lib/openbao/plugins"

            storage "postgresql" {}

            listener "tcp" {
              tls_disable = 0
              tls_cert_file = "/etc/ssl/certs/vault-tls.crt"
              tls_key_file  = "/etc/ssl/private/vault-tls.key"
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              telemetry {
               unauthenticated_metrics_access = "true"
              }
            }

            # Enable userpass auth
            initialize "auth" {
              request "enable-userpass" {
                operation = "update"
                path      = "sys/auth/userpass"
                data = {
                  type = "userpass"
                }
              }
            }

            # Create an admin policy
            initialize "policy" {
              request "superuser-policy" {
                operation = "update"
                path      = "sys/policies/acl/superuser"
                data = {
                  policy = "path \"*\" { capabilities = [\"create\",\"read\",\"update\",\"delete\",\"list\",\"sudo\"] }"
                }
              }
            }

            # Create admin user with password from env var (or swap to file source)
            initialize "identity" {
              request "admin-user" {
                operation = "update"
                path      = "auth/userpass/users/admin"
                data = {
                  password = {
                    eval_type   = "string"
                    eval_source = "env"
                    env_var     = "INITIAL_ADMIN_PASSWORD"
                    require_present = true
                  }
                  token_policies = ["superuser"]
                }
              }
            }

            # KV v2 mount used by External Secrets
            initialize "kv" {
              request "mount" {
                operation = "update"
                path      = "sys/mounts/secret"
                data = {
                  type    = "kv"
                  options = { version = "2" }
                }
              }
            }

            # Kubernetes auth for the External Secrets controller (no static credentials)
            initialize "eso" {
              request "auth" {
                operation = "update"
                path      = "sys/auth/kubernetes"
                data = {
                  type = "kubernetes"
                }
              }
              request "config" {
                operation = "update"
                path      = "auth/kubernetes/config"
                data = {
                  kubernetes_host = "https://kubernetes.default.svc"
                }
              }
              request "policy" {
                operation = "update"
                path      = "sys/policies/acl/external-secrets"
                data = {
                  policy = "path \"secret/data/*\" { capabilities = [\"create\",\"read\",\"update\",\"patch\"] }\npath \"secret/metadata/*\" { capabilities = [\"read\",\"list\",\"delete\"] }"
                }
              }
              request "role" {
                operation = "update"
                path      = "auth/kubernetes/role/external-secrets"
                data = {
                  bound_service_account_names      = ["external-secrets-operator-eso"]
                  bound_service_account_namespaces = ["operators"]
                  token_policies                   = ["external-secrets"]
                  ttl                              = "1h"
                }
              }
            }

            # OIDC login through Keycloak (realm ${KEYCLOAK_REALM_NAME}, client vault). The client secret and
            # the default gateway CA are read from the environment and the mounted CA file, never inlined.
            # The discovery URL must be the public issuer URL: Keycloak puts the same URL in `iss`.
            initialize "oidc" {
              request "auth" {
                operation = "update"
                path      = "sys/auth/oidc"
                data = {
                  type = "oidc"
                }
              }
              request "config" {
                operation = "update"
                path      = "auth/oidc/config"
                data = {
                  oidc_discovery_url = "https://iam.${DOMAIN_NAME}/realms/${KEYCLOAK_REALM_NAME}"
                  oidc_client_id     = "vault"
                  oidc_client_secret = {
                    eval_type       = "string"
                    eval_source     = "env"
                    env_var         = "OIDC_CLIENT_SECRET"
                    require_present = true
                  }
                  oidc_discovery_ca_pem = {
                    eval_type   = "string"
                    eval_source = "file"
                    path        = "/etc/ssl/certs/default-gateway-ca.crt"
                  }
                  default_role = "default"
                }
              }
              # Any realm user may sign in, but only gets the `default` policy.
              request "role-default" {
                operation = "update"
                path      = "auth/oidc/role/default"
                data = {
                  user_claim            = "preferred_username"
                  oidc_scopes           = ["openid", "profile", "email"]
                  allowed_redirect_uris = [
                    "https://vault.${DOMAIN_NAME}/ui/vault/auth/oidc/oidc/callback",
                    "http://localhost:8250/oidc/callback"
                  ]
                  token_policies        = ["default"]
                  ttl                   = "1h"
                }
              }
              # Group mapping: members of the Keycloak group `vault-admins` get `superuser`.
              # Sign in with role=admin. Needs a `groups` claim from Keycloak (see the README).
              request "role-admin" {
                operation = "update"
                path      = "auth/oidc/role/admin"
                data = {
                  user_claim            = "preferred_username"
                  groups_claim          = "groups"
                  oidc_scopes           = ["openid", "profile", "email"]
                  bound_claims          = {
                    groups = ["vault-admins"]
                  }
                  allowed_redirect_uris = [
                    "https://vault.${DOMAIN_NAME}/ui/vault/auth/oidc/oidc/callback",
                    "http://localhost:8250/oidc/callback"
                  ]
                  token_policies        = ["superuser"]
                  ttl                   = "1h"
                }
              }
            }

            seal "pkcs11" {
              lib       = "/usr/lib/nitrokey/libnethsm_pkcs11.so"
              slot      = "0"
              key_label = "bao-root-rsa"
              pin       = "${NETHSM_OPERATOR_PASSPHRASE}"
            }

            # Example configuration for enabling Prometheus metrics in your config.
            #telemetry {
            #  prometheus_retention_time = "30s"
            #  disable_hostname = true
            #}
    data:
      postgres:
        enabled: true
        postgresVersion: 17
        instances:
          - name: vaultdb
            replicas: 1
            dataVolumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
        proxy:
          pgBouncer:
            replicas: 1
    ca:
      enabled: true
      certificates:
        - name: vault
          dns:
            name: vault
            aliases:
              - vault.ucp.svc.cluster.local
              - vault.ucp.svc
              - vault.ucp
              - vault
          issuerRef:
            name: ca-issuer
            kind: ClusterIssuer
    gateway:
      enabled: true
      routes:
        - name: vault
          kind: HTTPRoute
          hostnames:
            - vault.${DOMAIN_NAME}
          rules:
            - matches:
                - headers:
                    - name: X-Forwarded-Proto
                      value: http
              filters:
                - type: RequestRedirect
                  requestRedirect:
                    scheme: https
                    statusCode: 301
            - backendRefs:
                - name: vault
                  port: 8200
          listeners:
            - name: default-gateway-listeners
              kind: ListenerSet
              namespace: kube-system
      policies:
        - name: tls-upstream-vault
          validation:
            hostname: vault.ucp.svc.cluster.local
            caCertificateRefs:
              - group: ""
                kind: Secret
                name: vault-tls
          targetRefs:
            - group: ""
              kind: Service
              name: vault
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-store-vault
  namespace: ucp
spec:
  interval: 10m0s
  releaseName: external-secrets-store-vault
  timeout: 15m0s
  dependsOn:
    - name: external-secrets-operator
      namespace: operators
    - name: vault
  chart:
    spec:
      interval: 5m
      chart: eso
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    secretStores:
      - kind: ClusterSecretStore
        name: external-secrets-store-vault
        provider:
          vault:
            server: https://vault.ucp.svc.cluster.local:8200
            path: secret
            version: v2
            caProvider:
              type: Secret
              name: vault-tls
              namespace: ucp
              key: ca.crt
            auth:
              kubernetes:
                mountPath: kubernetes
                role: external-secrets
                serviceAccountRef:
                  name: external-secrets-operator-eso
                  namespace: operators
      # Read-only access to the Vault TLS CA so other namespaces (e.g. minio KES) can sync it
      # with an ExternalSecret instead of copying it by hand.
      - kind: ClusterSecretStore
        name: external-secrets-store-ucp
        provider:
          kubernetes:
            remoteNamespace: ucp
            server:
              caProvider:
                type: ConfigMap
                name: kube-root-ca.crt
                key: ca.crt
                namespace: ucp
            auth:
              serviceAccount:
                name: vault-ca-reader
                namespace: ucp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-ca-reader
  namespace: ucp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-ca-reader
  namespace: ucp
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [vault-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-ca-reader
  namespace: ucp
subjects:
  - kind: ServiceAccount
    name: vault-ca-reader
    namespace: ucp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-ca-reader
---
# Read-only access to the default gateway certificate Secret in kube-system, so Vault can trust the
# CA that signs Keycloak's public hostname. Kept separate from external-secrets-store-vault because
# that release depends on `vault`, while the vault pod needs this Secret to start.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets-store-gateway
  namespace: ucp
spec:
  interval: 10m0s
  releaseName: external-secrets-store-gateway
  timeout: 15m0s
  dependsOn:
    - name: external-secrets-operator
      namespace: operators
  chart:
    spec:
      interval: 5m
      chart: eso
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: labsonline-catalog
        namespace: sre
  install:
    crds: CreateReplace
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    crds: CreateReplace
  values:
    secretStores:
      - kind: ClusterSecretStore
        name: external-secrets-store-kube-system
        provider:
          kubernetes:
            remoteNamespace: kube-system
            server:
              caProvider:
                type: ConfigMap
                name: kube-root-ca.crt
                key: ca.crt
                namespace: kube-system
            auth:
              serviceAccount:
                name: gateway-ca-reader
                namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-ca-reader
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-ca-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    # RBAC cannot limit keys: this Secret also holds the gateway's tls.key.
    resourceNames: [http-gw-cert]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-ca-reader
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: gateway-ca-reader
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-ca-reader
