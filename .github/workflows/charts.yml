---
name: Charts

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  HELM_VERSION: v3.22.1
  PYTHON_VERSION: "3.14"
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  UV_VERSION: 0.13.10
  YQ_VERSION: v4.54.3
  YQ_SHA256: 129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973

jobs:
  check:
    name: Lint and render charts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ldap and maas use helm-toolkit, and openstack uses rockoon, from upstream/.
          submodules: true

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yq and shellcheck
        run: |
          set -Eeuo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}"

          curl -fsSLo "${bin}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${bin}/yq" | sha256sum --check --strict
          chmod +x "${bin}/yq"

          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl -fsSLo "${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "${bin}/shellcheck"

          echo "${bin}" >> "${GITHUB_PATH}"

      - name: Show tool versions
        run: |
          helm version --short
          yq --version
          shellcheck --version
          uv run --no-project python --version

      - name: Test the checker
        run: uv run --no-project python -m unittest discover --start-directory hack/ci --verbose

      - name: Lint and render charts
        run: uv run --no-project hack/ci/check_charts.py
