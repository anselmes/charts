{{- if and .Values.client.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-key-{{ include "netbird.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: setup-key-resource-creator
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for setup-key CRDs to be available..."
              for i in {1..60}; do
                if kubectl get crd setupkeys.netbird.io >/dev/null 2>&1; then
                  echo "CRD found, creating SetupKey"
                  cat <<EOF | kubectl apply -f -
              apiVersion: netbird.io/v1alpha1
              kind: SetupKey
              metadata:
                name: {{ include "netbird.name" . }}-setup-key
                namespace: {{ .Release.Namespace }}
                labels:
                  {{- include "netbird.labels" $ | nindent 18 }}
              spec:
                name: netbird
                ephemeral: {{ .Values.client.setupKey.ephemeral }}
              EOF
                  exit 0
                fi
                echo "Attempt $i: setup-key CRD not ready, waiting 10s..."
                sleep 10
              done
              echo "Timeout waiting for setup-key CRD"
              exit 1
{{- end }}
