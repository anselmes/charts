{{- if and .Values.client.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-profile-{{ include "netbird.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netbird.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: sidecar-profile-resource-creator
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: alpine/k8s:1.32.3
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for sidecar-profile CRDs to be available..."
              for i in {1..60}; do
                if kubectl get crd sidecarprofiles.netbird.io >/dev/null 2>&1; then
                  echo "CRD found, creating SidecarProfile"
                  cat <<EOF | kubectl apply -f -
              apiVersion: netbird.io/v1alpha1
              kind: SidecarProfile
              metadata:
                name: {{ include "netbird.name" . }}-profile
                namespace: {{ .Release.Namespace }}
                labels:
                  {{- include "netbird.labels" $ | nindent 18 }}
              spec:
                setupKeyRef:
                  name: {{ include "netbird.name" . }}-setup-key
                podSelector:
                  matchLabels:
                    {{- range $key, $value := .Values.client.matchLabels }}
                    {{ $key }}: {{ $value }}
                    {{- end }}
              EOF
                  exit 0
                fi
                echo "Attempt $i: sidecar-profile CRD not ready, waiting 10s..."
                sleep 10
              done
              echo "Timeout waiting for sidecar-profile CRD"
              exit 1
{{- end }}
