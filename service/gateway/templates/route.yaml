{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: {{ .kind }}
metadata:
  name: {{ .name }}
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
  {{- if .hostnames }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ join "," .hostnames }}
  {{- end }}
spec:
  {{- if .hostnames }}
  hostnames:
    {{- range .hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- if .rules }}
  rules:
    {{- /* tpl: backend names can use release data, e.g. "{{ .Release.Name }}-endpoint" */}}
    {{- tpl (toYaml .rules) $ | nindent 4 }}
  {{- end }}
  {{- if .listeners }}
  parentRefs:
    {{- range .listeners }}
    - name: {{ .name }}
      namespace: {{ .namespace | default .Release.Namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
      {{- if .port }}
      port: {{ .port }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
