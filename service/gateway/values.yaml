# MARK: - Gateways

# Define the Gateway configurations.
# Each Gateway specifies its name, class, and listeners for handling traffic.
gateways:
  - name: default-gateway
    className: envoy
    # addresses:
    #   - type: IPAddress
    #     value: 10.200.201.2
    allowedListeners:
      namespaces:
        from: Same
    listeners:
      - name: http
        port: 80
        protocol: HTTP
        allowedRoutes:
          namespaces:
            from: All

