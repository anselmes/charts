{{- if and .Values.job.enabled .Values.job.commands }}
---
apiVersion: aistor.min.io/v1alpha1
kind: AdminJob
metadata:
  name: {{ .Values.job.name }}
  namespace: {{ .Release.Namespace }}
spec:
  execution: {{ .Values.job.execution | default "parallel" }}
  failureStrategy: {{ .Values.job.failureStrategy | default "stopOnFailure" }}
  serviceAccountName: {{ .Values.job.serviceAccountName.name }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished | default 3600 }}
  objectStore:
    name: {{ .Values.job.objectStore.name | default .Values.aistor.objectStore.name }}
    namespace: {{ .Values.job.objectStore.namespace | default .Release.Namespace }}
  {{- with .Values.job.podAnnotations }}
  podAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.job.podLabels }}
  podLabels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.job.commands }}
  commands:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
