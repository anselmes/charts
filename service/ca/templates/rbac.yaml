{{- if or .Values.issuers .Values.certificates .Values.bundles }}
{{- $resourceCreatorName := "cert-manager-resource-creator" -}}
{{- $existingServiceAccount := lookup "v1" "ServiceAccount" .Release.Namespace $resourceCreatorName -}}
{{- $existingClusterRole := lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" $resourceCreatorName -}}
{{- $existingClusterRoleBinding := lookup "rbac.authorization.k8s.io/v1" "ClusterRoleBinding" "" $resourceCreatorName -}}
{{- if not $existingServiceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $resourceCreatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
{{- end }}
{{- if not $existingClusterRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $resourceCreatorName }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
rules:
  - apiGroups:
      - cert-manager.io
    resources:
      - certificaterequests
      - certificates
      - clusterissuers
      - issuers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $resourceCreatorName }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
subjects:
  {{- $subjects := list (dict "kind" "ServiceAccount" "name" $resourceCreatorName "namespace" .Release.Namespace) -}}
  {{- if $existingClusterRoleBinding }}
  {{- range $existingClusterRoleBinding.subjects }}
  {{- if not (and (eq .kind "ServiceAccount") (eq .name $resourceCreatorName) (eq .namespace $.Release.Namespace)) }}
  {{- $subjects = append $subjects . }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $subjects }}
  - kind: {{ .kind }}
    name: {{ .name }}
    namespace: {{ .namespace }}
  {{- end }}
roleRef:
  kind: ClusterRole
  name: {{ $resourceCreatorName }}
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.bundles }}
{{- $bundleRoleName := printf "%s-bundles" $resourceCreatorName -}}
{{- $existingBundleRole := lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" $bundleRoleName -}}
{{- $existingBundleBinding := lookup "rbac.authorization.k8s.io/v1" "ClusterRoleBinding" "" $bundleRoleName -}}
{{- /* Kept apart from the role above: that one is only created when missing, so an existing
       install would never gain the trust-manager rule. */}}
{{- if not $existingBundleRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $bundleRoleName }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
rules:
  - apiGroups:
      - trust.cert-manager.io
    resources:
      - bundles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $bundleRoleName }}
  labels:
    {{- include "ca.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
subjects:
  {{- $bundleSubjects := list (dict "kind" "ServiceAccount" "name" $resourceCreatorName "namespace" .Release.Namespace) -}}
  {{- if $existingBundleBinding }}
  {{- range $existingBundleBinding.subjects }}
  {{- if not (and (eq .kind "ServiceAccount") (eq .name $resourceCreatorName) (eq .namespace $.Release.Namespace)) }}
  {{- $bundleSubjects = append $bundleSubjects . }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $bundleSubjects }}
  - kind: {{ .kind }}
    name: {{ .name }}
    namespace: {{ .namespace }}
  {{- end }}
roleRef:
  kind: ClusterRole
  name: {{ $bundleRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
