{{- range .Values.certificates }}
{{- $name := tpl .name $ }}
{{- $commonName := tpl .dns.name $ }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-certificate-{{ $name }}
  labels:
    {{- include "ca.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: {{ .hook | default "post-install,post-upgrade" }}
    helm.sh/hook-weight: {{ .hookWeight | default 10 | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: cert-manager-resource-creator
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: alpine/k8s:1.32.3
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for cert-manager CRDs to be available..."
              for i in {1..60}; do
                if kubectl get crd certificates.cert-manager.io >/dev/null 2>&1; then
                  echo "CRD found, creating Certificate"
                  cat <<EOF | kubectl apply -f -
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: {{ $name }}-cert
                namespace: {{ $.Release.Namespace }}
                labels:
                  {{- include "ca.labels" $ | nindent 18 }}
              spec:
                secretName: {{ $name }}-tls
                duration: {{ .duration }}
                renewBefore: {{ .renewal }}
                commonName: {{ $commonName }}
                {{- if .isCA }}
                isCA: true
                {{- end }}
                {{- with .subject }}
                subject:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                issuerRef:
                  name: {{ tpl .issuerRef.name $ }}
                  kind: {{ .issuerRef.kind }}
                dnsNames:
                {{- range .dns.aliases }}
                  - {{ tpl . $ | quote }}
                {{- end }}
                ipAddresses:
                {{- range .dns.addresses }}
                  - {{ . }}
                {{- end }}
                usages:
                {{- range .dns.usages }}
                  - {{ . }}
                {{- end }}
              EOF
                  {{- if .wait }}
                  echo "Waiting for Certificate {{ $name }}-cert to be Ready..."
                  for j in {1..60}; do
                    if [[ "$(kubectl get certificate {{ $name }}-cert -n {{ $.Release.Namespace }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')" == "True" ]]; then
                      echo "Certificate Ready"
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "Timed out waiting for Certificate {{ $name }}-cert"
                  exit 1
                  {{- else }}
                  exit 0
                  {{- end }}
                fi
                echo "Attempt $i: cert-manager CRD not ready, waiting 10s..."
                sleep 10
              done
              echo "Timeout waiting for cert-manager CRD"
              exit 1
{{- end }}
