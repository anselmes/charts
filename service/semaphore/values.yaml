    #   className: envoy
    #   listeners:
    #     - name: http
    #       port: 80
    #       protocol: HTTP
    #       allowedRoutes:
    #         namespaces:
    #           from: Same
    #     - name: https
    #       port: 443
    #       protocol: HTTPS
    #       hostname: semaphore.local
    #       allowedRoutes:
    #         namespaces:
    #           from: Same
    #       tls:
    #         mode: Terminate
    #         certificateRefs:
    #           - name: semaphore-gw-cert
    #             issuer: semaphore-ca-issuer
    #             type: Issuer
