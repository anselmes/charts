{{/*
Legacy/offline path: a static Secret built from grafana.admin.password.
Only rendered when grafana.admin.create is true. By default (create: false)
this chart expects the Secret to already exist, created out-of-band by a
separate eso HelmRelease -- external-secrets is never bundled as a chart
dependency here (see the fleet-secrets/semaphoreui-secrets pattern).
*/}}
{{- if and .Values.grafana.enabled .Values.grafana.admin.create }}
{{- $secretName := .Values.grafana.admin.secretName | default (printf "%s-grafana-admin" (include "monitoring.fullname" .)) }}
{{- if not .Values.grafana.admin.password }}
{{- fail "grafana.admin.password must be set when grafana.admin.create is true" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
data:
  password: {{ .Values.grafana.admin.password | b64enc }}
{{- end }}
