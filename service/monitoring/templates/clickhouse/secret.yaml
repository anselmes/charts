{{- if and .Values.clickhouse.enabled .Values.clickhouse.cluster.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clickhouse.cluster.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
data:
  password: {{ .Values.clickhouse.cluster.secret.password | b64enc }}
{{- end }}
