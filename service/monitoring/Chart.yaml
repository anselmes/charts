---
apiVersion: v2
name: monitoring
type: application
description: >-
  A Helm chart that deploys a ClickHouse + OpenTelemetry + Grafana observability
  stack (Grafana Alloy for collection, an OTel Collector bridge, and ClickHouse
  for storage), fronted by a Gateway API gateway and TLS issued by a dedicated,
  namespaced Issuer. Secrets (ClickHouse, Grafana admin) are expected to be
  provisioned out-of-band by a separate eso HelmRelease.
version: 7.0.1
dependencies:
  # node-agent / cluster-agent must stay on the same opentelemetry-collector version as the one bundled by the
  # clickstack chart (see its Chart.yaml, ~0.146): Helm named templates are global per release, so two versions of
  # the same chart in one release collide and fail to render.
  - alias: node-agent
    name: opentelemetry-collector
    version: 0.146.1
    repository: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
    condition: node-agent.enabled
  - alias: cluster-agent
    name: opentelemetry-collector
    version: 0.146.1
    repository: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
    condition: cluster-agent.enabled
  - alias: clickhouse-operator
    name: clickhouse-operator-helm
    repository: oci://ghcr.io/clickhouse
    version: 0.0.8
    condition: clickhouse-operator.enabled
  - name: clickstack
    repository: https://clickhouse.github.io/ClickStack-helm-charts
    version: 3.8.0
    condition: clickstack.enabled
  - alias: monitoring
    name: k8s-monitoring
    repository: https://grafana.github.io/helm-charts
    version: 4.6.1
    condition: monitoring.enabled
  - alias: grafana
    name: grafana-operator
    repository: oci://ghcr.io/grafana/helm-charts
    version: 5.26.0
    condition: grafana.operator.enabled
  - alias: secret
    name: eso
    repository: oci://ghcr.io/labsonline/charts
    version: 2.15.0
    condition: secret.enabled
  - name: data
    repository: oci://ghcr.io/labsonline/charts
    version: 1.0.1
    condition: data.mongo.enabled
  - name: ca
    repository: oci://ghcr.io/labsonline/charts
    version: 1.2.0
    condition: ca.enabled
  - name: gateway
    repository: oci://ghcr.io/labsonline/charts
    version: 1.2.0
    condition: gateway.enabled
