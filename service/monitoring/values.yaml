---
# MARK: Shared

fullnameOverride: monitoring

jobs:
  kubectlImage:
    registry: docker.io
    repository: alpine/k8s
    tag: "1.32.3"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false # kubectl needs $HOME writable for its cache
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

# MARK: Kubernetes Monitoring

# Grafana k8s-monitoring Stack Configuration (Grafana Alloy collectors).
monitoring:
  enabled: true

  cluster:
    # Cluster name identifier for multi-cluster observability
    # Used to distinguish metrics, logs, and traces from different clusters
    name: ""

  global:
    # Target platform for optimized configurations
    # Supported platforms: "openshift"
    # Determines platform-specific optimizations and compatibility settings
    platform: ""

  destinations:
    otlpCollector:
      type: otlp
      url: http://monitoring-otel-collector:4317
      metrics: { enabled: true }
      logs: { enabled: true }
      traces: { enabled: true }
    # hostedMetrics:
    #   type: prometheus
    #   url: https://prometheus.example.com/api/prom/push
    #   auth:
    #     type: basic
    #     username: username
    #     password: password
    # hostedLogs:
    #   type: loki
    #   url: https://loki.example.com/loki/api/v1/push
    #   auth:
    #     type: basic
    #     username: username
    #     password: password
    #     tenantIdFrom: env("LOKI_TENANT_ID")

  # Cluster-level metrics collection configuration
  # Collects system-wide metrics including node resources, cluster state, and API server metrics
  clusterMetrics:
    # Enable collection of cluster-wide metrics
    # Provides insights into overall cluster health and resource utilization
    enabled: true

  # Kubernetes events collection configuration
  # Captures and forwards cluster events for troubleshooting and auditing
  clusterEvents:
    # Enable collection of Kubernetes events
    # Useful for tracking pod lifecycle, scaling events, and cluster state changes
    enabled: false

  # Node-level log collection configuration
  # Collects system logs from cluster nodes including kubelet, container runtime logs
  nodeLogs:
    # Enable collection of node-level system logs
    # Provides low-level system insights and container runtime diagnostics
    enabled: false

  # Pod log collection configuration
  # Collects application and container logs from all pods in the cluster
  podLogs:
    # Enable collection of pod logs via node-based log collection
    # More efficient for high-volume logging environments
    enabled: false

  # Alternative pod log collection via Kubernetes API
  # Collects pod logs directly through the Kubernetes API server
  podLogsViaKubernetesApi:
    # Enable collection of pod logs via Kubernetes API
    # More resource-intensive but useful for selective log collection
    enabled: false

  # Application observability and tracing configuration
  # Enables distributed tracing and application performance monitoring
  applicationObservability:
    # Enable application observability features
    # Provides distributed tracing, application metrics, and service mapping
    enabled: false

  # Automatic instrumentation for application tracing
  # Automatically instruments applications for distributed tracing without code changes
  autoInstrumentation:
    # Enable automatic instrumentation of applications
    # Supports automatic OpenTelemetry instrumentation for various languages
    enabled: false

  # Annotation-based service discovery configuration
  # Automatically discovers and monitors services based on annotations
  annotationAutodiscovery:
    # Enable automatic discovery of services via annotations
    # Allows services to opt-in to monitoring through Kubernetes annotations
    enabled: false

  # Prometheus Operator objects integration
  # Enables integration with existing Prometheus Operator CRDs (ServiceMonitor, PodMonitor, etc.)
  prometheusOperatorObjects:
    # Enable support for Prometheus Operator custom resources
    # Allows reuse of existing ServiceMonitor and PodMonitor configurations
    enabled: false

  # Continuous profiling configuration
  # Enables collection of application performance profiles for optimization
  profiling:
    # Enable continuous profiling of applications
    # Collects CPU, memory, and other performance profiles for analysis
    enabled: false

  # Profiles receiver configuration
  # Configures the receiving endpoint for performance profiles
  profilesReceiver:
    # Enable profiles receiver for collecting performance data
    # Receives and processes profiling data from applications
    enabled: false

  # Grafana Alloy collector instances. Each key is a collector name; the five
  # below are the chart's canonical roles (see k8s-monitoring's collectors/
  # docs). A feature (clusterMetrics, podLogs, etc.) only produces telemetry
  # once a collector that can carry it is enabled here.
  collectors:
    # Deploys Alloy agents for metrics collection and forwarding
    # Lightweight agents for collecting and forwarding Prometheus metrics
    alloy-metrics:
      enabled: true

    # Single instance Alloy deployment for centralized collection tasks
    # Used for cluster-wide collection tasks that should run once per cluster
    alloy-singleton:
      enabled: false

    # Deploys Alloy agents for log collection and forwarding
    # Collects and forwards logs to centralized logging systems
    alloy-logs:
      enabled: false

    # Deploys Alloy as a receiver for telemetry data
    # Receives and processes metrics, logs, and traces from various sources
    alloy-receiver:
      enabled: false

    # Deploys Alloy agents for performance profiling data collection
    # Collects and forwards continuous profiling data
    alloy-profiles:
      enabled: false

# MARK: Grafana

grafana:
  enabled: false

  name: grafana

  admin:
    username: root
    # Secret name holding the admin password (key: password). Defaults to
    # "<fullname>-grafana-admin" when empty.
    secretName: ""
    create: false
    password: ""

  storage:
    class: ""
    size: 10Gi

# MARK: Grafana Dashboards

  # ClickHouse plugin's bundled OTel + general-purpose dashboards. Rather
  # than vendoring the JSON (which silently drifts from the pinned plugin
  # version), each entry is fetched by grafana-operator at reconcile time via
  # `url:`, built from dashboardSource below. The clusters are air-gapped, so
  # dashboardSource.baseUrl must point at an internal mirror (e.g. a static
  # blob proxied through Mirantis Secure Registry) that mirrors
  # https://github.com/grafana/clickhouse-datasource/tree/<tag>/src/dashboards
  # -- set that up and point baseUrl at it before relying on this.
  dashboardSource:
    # e.g. https://msr.harbor.local/artifactory/clickhouse-datasource-dashboards
    baseUrl: ""
    # Pin to the exact grafana-clickhouse-datasource plugin version installed
    # below (datasources[].plugins[].version) so dashboards and datasource
    # stay in lockstep.
    pluginVersion: "4.20.0"

  dashboards:
    - name: cluster-analysis
      folderName: clickhouse
      fromPlugin: true
    - name: data-analysis
      folderName: clickhouse
      fromPlugin: true
    - name: query-analysis
      folderName: clickhouse
      fromPlugin: true
    - name: system-dashboards
      folderName: clickhouse
      fromPlugin: true
    - name: otel-logs-explorer
      folderName: clickhouse
      fromPlugin: true
    - name: otel-service-dashboard
      folderName: clickhouse
      fromPlugin: true
    - name: otel-traces-explorer
      folderName: clickhouse
      fromPlugin: true
    # Ad-hoc dashboard example (bypasses dashboardSource):
    # - name: my-dashboard
    #   folderName: custom
    #   url: ""
    #   gzipJson: ""
    #   json: >
    #     {}
    #   plugins: []
    #     # - name: grafana-piechart-panel
    #     #   version: 1.3.9

# MARK: Grafana Folders

  folders:
    - clickhouse

# MARK: Grafana Datasources

  datasources:
    - name: ClickHouse
      uid: clickhouse
      type: grafana-clickhouse-datasource
      access: proxy
      jsonData:
        host: clickhouse-cluster-clickhouse-headless
        port: 9000
        protocol: native
        secure: false
        username: default
        defaultDatabase: otel
        dialTimeout: 10
        queryTimeout: 60
        logs:
          defaultDatabase: otel
          defaultTable: otel_logs
          otelEnabled: true
          otelVersion: latest
        traces:
          defaultDatabase: otel
          defaultTable: otel_traces
          otelEnabled: true
          otelVersion: latest
      valuesFrom:
        - targetPath: secureJsonData.password
          valueFrom:
            secretKeyRef:
              name: clickhouse-default-password
              key: password
      plugins:
        - name: grafana-clickhouse-datasource
          version: 4.20.0

# MARK: Grafana Operator

  operator:
    enabled: false

    # -- The number of operators to run simultaneously.
    # With leader election, only one instance reconciles CRs preventing duplicate reconciliations.
    # Note: Multiple replicas increase stability, it does not increase throughput.
    replicas: 1

    # -- Additional environment variables
    env: []
      # -- grafana image, e.g. docker.io/grafana/grafana:9.1.6, overwrites the default grafana image defined in the operator
      # - name: RELATED_IMAGE_GRAFANA
      #   value: "docker.io/grafana/grafana:9.1.6"
      # - name: MY_VAR
      #   value: "myvalue"

    image:
      # -- grafana operator image registry
      registry: ghcr.io
      # -- grafana operator image repository
      repository: grafana/grafana-operator
      # -- The image pull policy to use in grafana operator container
      pullPolicy: IfNotPresent
      # -- Overrides the image tag whose default is the chart appVersion.
      tag: ""

    # -- image pull secrets
    imagePullSecrets: []

    # -- grafana operator container resources
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    # -- container security context
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault

    # -- pod tolerations
    tolerations: []

    # -- pod affinity
    affinity: {}

    # -- extra pod volumes
    extraVolumes: []

    # -- extra container volume mounts
    extraVolumeMounts: []

# MARK: ClickHouse

clickhouse:
  enabled: false

  keeper:
    name: clickhouse-keeper
    replicas: 3
    storage:
      # class: fast-ssd
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  cluster:
    name: clickhouse-cluster
    replicas: 3
    shards: 2
    secret:
      name: clickhouse-default-password
      create: false
      password: ""
    storage:
      # class: fast-ssd
      size: 100Gi
    # ClickHouse's own memory tracker budgets off the container memory limit,
    # so the limit must comfortably exceed its idle/background footprint
    # (system tables, merges, caches) or even trivial queries hit
    # MEMORY_LIMIT_EXCEEDED.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

# MARK: ClickHouse Operator

  operator:
    enabled: false

    ## Configure the controller manager deployment
    ##
    manager:
      ## Set to false to skip manager installation
      ##
      enabled: true

      replicas: 1

      image:
        ## Optional registry prefix for this image. Overridden by global.imageRegistry
        ## when set. Empty uses repository as-is.
        ##
        registry: ""
        repository: ghcr.io/clickhouse/clickhouse-operator
        ## Digest of the image to use. Tag is used if unset.
        ##
        ## digest: sha256:abc123
        ## Image tag (defaults to Chart.appVersion if not set)
        ##
        tag: ""
        pullPolicy: IfNotPresent

      ## Arguments
      ##
      args:
        - --leader-elect

      ## Env overrides (--set manager.envOverrides.VAR=value)
      ## Same name in env above: this value takes precedence.
      ##
      envOverrides: {}

      ## Image pull secrets
      ##
      # imagePullSecrets:
      #   - name: myregistrykey

      ## Resource limits and requests
      ##
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi

      ## Container security context
      ##
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault

      ## Manager pod's node selector
      ##
      nodeSelector: {}

      ## Manager pod's tolerations
      ##
      tolerations: []

      ## Extra volumes and volume mounts
      ##
      extraVolumes: [ ]

      extraVolumeMounts: [ ]

    ## Custom Resource Definitions
    ##
    crd:
      # Install CRDs with the chart
      enabled: true
      # Keep CRDs when uninstalling
      keep: true

    ## Cert-manager integration for TLS certificates.
    ## Required for webhook certificates and metrics endpoint certificates.
    ##
    certManager:
      enabled: true
      ## Custom issuer configuration for cert-manager issued certificates.
      ## Defaults to this chart's own monitoring-ca-issuer (see ca: below).
      ##
      issuerRef:
        name: monitoring-ca-issuer
        kind: Issuer

    ## Prometheus ServiceMonitor for metrics scraping.
    ## Requires prometheus-operator to be installed in the cluster.
    ##
    prometheus:
      # Add annotations to allow Prometheus service discovery scrape metrics.
      scraping_annotations: false
      # Enable Prometheus ServiceMonitor for metrics scraping.
      # Requires prometheus-operator to be installed in the cluster.
      enabled: false

    ## Kubernetes NetworkPolicies restricting ingress to the metrics and webhook ports.
    ##
    networkPolicy:
      enabled: false

    # Extra manifests to deploy as an array
    extraManifests: []
      # - |
      #   apiVersion: v1
      #   kind: ConfigMap
      #   metadata:
      #   labels:
      #     name: prometheus-extra
      #   data:
      #     extra-data: "value"

# MARK: OTel Collector

# Grafana Alloy has no ClickHouse exporter, and ClickHouse has no OTLP-compatible
# listener of its own -- this deploys a vanilla OpenTelemetry Collector Contrib
# instance as a bridge, using its clickhouseexporter (which supports
# create_schema). Point a monitoring.destinations.<name> "otlp" destination at
# this collector's Service (port 4317 for gRPC, 4318 for HTTP) rather than at
# ClickHouse directly.
collector:
  enabled: false

  replicas: 1

  image:
    registry: docker.io
    repository: otel/opentelemetry-collector-contrib
    tag: 0.128.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  clickhouse:
    # ClickHouse native TCP endpoint as host:port (no scheme or query string --
    # the template builds the full tcp:// DSN).
    endpoint: clickhouse-cluster-clickhouse-headless:9000
    database: otel
    username: default
    # Secret holding the ClickHouse user's password (see clickhouse.cluster.secret).
    secret:
      name: clickhouse-default-password
      key: password
    ttl: 72h

# MARK: Certificate Authority (cert-manager)

# A namespaced Issuer (never ClusterIssuer) for this release's Gateway TLS
# listeners, vendored the same way vault/Chart.yaml and fleet's "ca:" block
# do it (not assumed to exist cluster-wide). This never deploys cert-manager
# or trust-manager themselves -- those are cluster-wide, pre-existing
# add-ons; the `ca` dependency here only creates the Issuer object against
# the cert-manager CRDs already in the cluster.
ca:
  enabled: true

  issuers:
    - name: monitoring-ca-issuer
      selfSigned: true
      secret:
        create: false

# MARK: Gateway (Gateway API)

# Fronts Grafana's UI and the OTel Collector's ingestion ports. `enabled`
# here gates whether this release installs its own `gateway` chart instance;
# set false and wire the routes below at a cluster level instead if a
# shared gateway already exists on a given cluster. Listeners only accept
# routes from this release's own namespace (allowedRoutes.namespaces.from:
# Same), and TLS certificateRefs reference the namespaced Issuer above
# (type: Issuer, never ClusterIssuer).
gateway:
  enabled: true

  grafanaHostname: grafana.local
  otlpHostname: otlp.monitoring.local

  gateways:
    - name: monitoring-gateway
      className: envoy # verify this matches the installed GatewayClass (gwapi chart's envoy class by convention)
      listeners:
        - name: https
          port: 443
          protocol: HTTPS
          hostname: grafana.local
          allowedRoutes:
            namespaces:
              from: Same
          tls:
            mode: Terminate
            certificateRefs:
              - name: monitoring-grafana-tls
                issuer: monitoring-ca-issuer
                type: Issuer
        - name: otlp-grpc
          port: 4317
          protocol: HTTPS
          hostname: otlp.monitoring.local
          allowedRoutes:
            namespaces:
              from: Same
            kinds:
              - kind: GRPCRoute
          tls:
            mode: Terminate
            certificateRefs:
              - name: monitoring-otlp-tls
                issuer: monitoring-ca-issuer
                type: Issuer
        - name: otlp-http
          port: 4318
          protocol: HTTPS
          hostname: otlp.monitoring.local
          allowedRoutes:
            namespaces:
              from: Same
            kinds:
              - kind: HTTPRoute
          tls:
            mode: Terminate
            certificateRefs:
              - name: monitoring-otlp-tls
                issuer: monitoring-ca-issuer
                type: Issuer

  routes:
    - name: grafana
      kind: HTTPRoute
      hostnames:
        - grafana.local
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
      gateways:
        - name: monitoring-gateway
    - name: otel-collector-grpc
      kind: GRPCRoute
      hostnames:
        - otlp.monitoring.local
      rules:
        - backendRefs:
            - name: monitoring-otel-collector
              port: 4317
      gateways:
        - name: monitoring-gateway
    - name: otel-collector-http
      kind: HTTPRoute
      hostnames:
        - otlp.monitoring.local
      rules:
        - backendRefs:
            - name: monitoring-otel-collector
              port: 4318
      gateways:
        - name: monitoring-gateway
