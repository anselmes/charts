        name: clickstack
        size: 3
    sharding:
      enabled: true
      balancer:
        enabled: true
      configrs:
        size: 3
      mongos:
        size: 3

    users:
      - name: clickstack
        db: admin
        passwordSecretRef:
          name: clickstack-credentials
          key: MONGODB_PASSWORD
        roles:
          - name: dbOwner
            db: clickstack

    backup:
      enabled: true
      image:
        repository: percona/percona-backup-mongodb
        # tag: 2.11.0

    logcollector:
      enabled: true
      image:
        repository: percona/fluentbit
        # tag: 4.0.1

# MARK: External Secret

secret:
  enabled: false

  generators: []
    # - kind: Password
    #   name: pwdgen
    #   generator:
    #     passwordSpec:
    #       length: 42
    #       digits: 5
    #       symbols: 5
    #       symbolCharacters: -_$@
    #       noUpper: false
    #       allowRepeat: true
    # - kind: ClusterGenerator
    #   name: uuidgen
    #   type: UUID
    #   generator:
    #     uuidSpec: {}

  externalSecrets:
    - kind: ExternalSecret
      name: clickhouse-default-password
      # Pre-install: read at start-up by the ClickHouse CR, so it must exist before the CR is applied.
      hook: pre-install,pre-upgrade
      externalSecretSpec:
        refreshInterval: "0"
        target:
          creationPolicy: Owner
        dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ClusterGenerator  # Password | ClusterGenerator
                name: pwdgen
    # Admin credentials for the HyperDX user that the ingest-key-sync CronJob (clickstack.additionalManifests) registers and logs in as.
    # HyperDX rejects a password without a special character from !@#$%^&*(),.?":{}|<>;-+= (`_` does not count), but the
    # shared pwdgen draws its symbols from "-_", so roughly 1 in 32 passwords has none. The trailing `+` guarantees one.
    - kind: ExternalSecret
      name: clickstack-admin
      externalSecretSpec:
        refreshInterval: "0"
        target:
          creationPolicy: Owner
          template:
            data:
              password: "{{ .password }}+"
        dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ClusterGenerator  # Password | ClusterGenerator
                name: pwdgen
    # Real ClickStack credentials, owned by ESO alone. Helm never renders this Secret, so an upgrade cannot reset it
    # (the upstream-rendered `clickstack-secret` is Helm-owned: an ESO `Merge` into it was reset to the empty
    # placeholders on every `helm upgrade` and then refilled with NEWLY generated passwords, breaking ClickHouse,
    # Mongo and the app). Pre-install so every consumer finds it at start-up.
    - kind: ExternalSecret
      name: clickstack-credentials
      hook: pre-install,pre-upgrade
      externalSecretSpec:
        refreshInterval: "0"
        target:
          creationPolicy: Owner
          template:
            data:
              CLICKHOUSE_PASSWORD: "{{ .clickhouse_otel_password }}"
              CLICKHOUSE_APP_PASSWORD: "{{ .clickhouse_app_password }}"
              CLICKHOUSE_APP_PASSWORD_JSON: "{{ .clickhouse_app_password | toJson }}"
              MONGODB_PASSWORD: "{{ .mongodb_password }}"
              MONGODB_PASSWORD_URLENC: "{{ .mongodb_password | urlquery }}"
              HYPERDX_API_KEY: "{{ .uuid }}"
        dataFrom:
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ClusterGenerator  # Password | ClusterGenerator
                name: pwdgen
            rewrite:
              - regexp:
                  source: "^password$"
                  target: clickhouse_app_password
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ClusterGenerator  # Password | ClusterGenerator
                name: pwdgen
            rewrite:
              - regexp:
                  source: "^password$"
                  target: clickhouse_otel_password
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ClusterGenerator  # Password | ClusterGenerator
                name: pwdgen
            rewrite:
              - regexp:
                  source: "^password$"
                  target: mongodb_password
          - sourceRef:
              generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: ClusterGenerator  # Password | ClusterGenerator
                name: uuidgen

