{{- range .Values.envoy.proxies }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-envoy-proxy-{{ .name }}
  labels:
    {{- include "gwapi.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      serviceAccountName: envoy-resource-creator
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: alpine/k8s:1.32.3
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Waiting for envoy-proxy CRDs to be available..."
              for i in {1..60}; do
                if kubectl get crd envoyproxies.gateway.envoyproxy.io >/dev/null 2>&1; then
                  echo "CRD found, creating EnvoyProxy"
                  cat <<EOF | kubectl apply -f -
              apiVersion: gateway.envoyproxy.io/v1alpha1
              kind: EnvoyProxy
              metadata:
                name: {{ .name | default "envoy-proxy" }}
                namespace: {{ $.Release.Namespace }}
                labels:
                  {{- include "gwapi.labels" $ | nindent 18 }}
              spec:
                mergeGateways: {{ .mergeGateways | default false }}
                ipFamily: {{ .ipFamily | default "IPv4" }}
                provider:
                  type: Kubernetes
                  kubernetes:
                    envoyService:
                      type: {{ .serviceType | default "LoadBalancer" }}
                      {{- with .externalTrafficPolicy }}
                      externalTrafficPolicy: {{ . | default "Local" }}
                      {{- end }}
                      {{- with .patch }}
                      patch:
                        {{- toYaml . | nindent 24 }}
                      {{- end }}
                logging:
                  level:
                    default: {{ .logging.level.default | default "info" }}
              EOF
                  exit 0
                fi
                echo "Attempt $i: envoy-proxy CRD not ready, waiting 10s..."
                sleep 10
              done
              echo "Timeout waiting for envoy-proxy CRD"
              exit 1
{{- end }}
