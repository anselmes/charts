{{- /*
RBAC for the create-envoy-proxy hook Jobs (templates/envoy/proxy.yaml).

These are pre-install/pre-upgrade hooks so they exist before the post-install Jobs
run. Hook resources are not part of the release, so `helm uninstall` leaves them
behind. They are recreated on every install and upgrade (before-hook-creation)
rather than guarded with `lookup`: a leftover ClusterRoleBinding from an earlier
release, or from one in another namespace, would otherwise be kept and leave this
release's ServiceAccount without permissions, and the Job would wait forever.
*/ -}}
{{- if and .Values.envoy.enabled (not (empty .Values.envoy.proxies)) }}
{{- $resourceCreatorName := "envoy-resource-creator" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $resourceCreatorName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gwapi.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $resourceCreatorName }}
  labels:
    {{- include "gwapi.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups:
      - gateway.envoyproxy.io
    resources:
      - envoyproxies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $resourceCreatorName }}
  labels:
    {{- include "gwapi.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $resourceCreatorName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $resourceCreatorName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
